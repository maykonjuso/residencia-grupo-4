<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUmo · perfil no navegador (demonstração #66)</title>
<style>
  :root { --tinta: #1d2b36; --fundo: #f6f4ef; --borda: #d9d3c7; --acento: #0b6e4f; --destaque: #fff3c4; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--tinta); background: var(--fundo); }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; grid-template-columns: 1fr 340px; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 20px; }
  section { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 10px; font-size: 15px; }
  .rumo-perfil { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                 background: #eaf4ef; border: 1px solid #b7d8c8; border-radius: 10px; padding: 10px 14px; }
  .rumo-perfil form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .rumo-perfil label { display: grid; font-size: 13px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--borda); border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { border-color: var(--acento); }
  #chat { display: grid; gap: 10px; min-height: 160px; }
  .msg { padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; }
  .msg.eu { background: #eef1f4; justify-self: end; max-width: 80%; }
  .msg.milton { background: #f7f7f2; border: 1px solid var(--borda); }
  .msg.minha { background: #e5f4ec; border: 1px solid #9fd0b6; font-weight: 600; }
  .msg small { display: block; font-weight: 400; color: #5b6770; margin-top: 4px; }
  .rumo-oferta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border: 1px dashed var(--acento); border-radius: 8px; }
  form.perguntar { display: flex; gap: 8px; margin-top: 12px; }
  form.perguntar input { flex: 1; padding: 6px 10px; font: inherit; }
  .atalhos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .comp { margin: 8px 0; }
  .comp b { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: #5b6770; }
  .comp li.destaque { background: var(--destaque); font-weight: 600; }
  #log { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-height: 520px; overflow: auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Milton · demonstração do perfil leve (#66)</h1>
  <div id="painel"></div>

  <div style="display:grid; gap:20px">
    <section>
      <h2>Chat</h2>
      <div id="chat"></div>
      <form class="perguntar" id="form">
        <input id="pergunta" placeholder="Pergunte algo sobre o RU" autocomplete="off">
        <button>Enviar</button>
      </form>
      <div class="atalhos">
        <button type="button" data-p="quanto custa o almoço?">quanto custa o almoço?</button>
        <button type="button" data-p="qual o preço do café da manhã?">preço do café</button>
      </div>
    </section>

    <section>
      <h2>Cardápio</h2>
      <label>Data <input type="date" id="data" value="2026-11-09"></label>
      <label>Refeição <select id="refeicao"><option value="almoco">Almoço</option><option value="jantar">Jantar</option><option value="cafe">Café da manhã</option></select></label>
      <div id="cardapio"></div>
    </section>
  </div>

  <section>
    <h2>O que foi enviado ao servidor</h2>
    <p style="font-size:13px;margin:0 0 8px">Cada requisição feita por esta página. O perfil não aparece em nenhuma.</p>
    <div id="log"></div>
  </section>
</main>

<script type="module">
  import * as perfil from "./rumo-perfil.js";

  const $ = (s) => document.querySelector(s);
  const log = $("#log");

  // fetch que registra tudo o que sai, para a demonstração do critério "nada vai para o servidor"
  const fetchRegistrado = (url, opcoes = {}) => {
    log.textContent += `${opcoes.method || "GET"} ${url}\n${opcoes.body ? opcoes.body + "\n" : ""}\n`;
    return fetch(url, opcoes);
  };
  const api = perfil.criarCliente({ base: "", fetch: fetchRegistrado });

  function msg(classe, texto, nota) {
    const d = document.createElement("div");
    d.className = "msg " + classe;
    d.textContent = texto;
    if (nota) { const s = document.createElement("small"); s.textContent = nota; d.append(s); }
    $("#chat").append(d);
    return d;
  }

  async function perguntar(texto) {
    msg("eu", texto);
    const p = perfil.carregar();
    const ehPreco = perfil.ehPerguntaDePreco(texto);

    // a resposta personalizada sai do navegador: tabela igual para todos + grupo local
    if (ehPreco && p.grupo) {
      const minha = perfil.respostaDePreco(p, await api.precos(), texto);
      if (minha) {
        msg("minha", minha.texto, "Grupo errado? Edite ou apague o perfil na faixa verde.");
        return;
      }
    }
    try {
      const r = await api.perguntar(texto, { data: $("#data").value });
      const fontes = (r.fontes || []).map((f) => `[${f.n}] ${f.doc_id}, p. ${f.pagina}`).join("  ");
      msg("milton", r.resposta, fontes);
    } catch (e) {
      msg("milton", "Não consegui falar com o RUmo agora (" + e.message + ").");
    }
    if (ehPreco && perfil.deveOferecer(perfil.carregar(), "grupo")) {
      perfil.ofertaDeGrupo($("#chat"), { aoEscolher: () => painel.atualizar() });
    }
  }

  async function desenharCardapio() {
    const alvo = $("#cardapio");
    alvo.textContent = "carregando…";
    try {
      const bruto = await api.cardapio($("#data").value, $("#refeicao").value);
      const c = perfil.ordenarCardapio(bruto, perfil.carregar().trilha);
      alvo.replaceChildren();
      for (const comp of c.compartimentos) {
        const div = document.createElement("div");
        div.className = "comp";
        div.innerHTML = `<b></b><ul></ul>`;
        div.querySelector("b").textContent = `${comp.titulo} (até ${comp.max})`;
        for (const o of comp.opcoes) {
          const li = document.createElement("li");
          li.textContent = o.nome + (o.trilha !== "todas" ? ` · ${perfil.TRILHAS[o.trilha]}` : "");
          if (o.destaque) li.className = "destaque";
          div.querySelector("ul").append(li);
        }
        alvo.append(div);
      }
      const f = c.fonte;
      const s = document.createElement("small");
      s.textContent = `Fonte: ${f.doc_id}, p. ${f.pagina}`;
      alvo.append(s);
    } catch (e) {
      alvo.textContent = "Sem cardápio para essa data na base.";
    }
  }

  const painel = perfil.montarPainel($("#painel"));  // salvar/apagar disparam rumo:perfil
  window.addEventListener(perfil.EVENTO, desenharCardapio);

  $("#form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const t = $("#pergunta").value.trim();
    if (t) { $("#pergunta").value = ""; perguntar(t); }
  });
  document.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => perguntar(b.dataset.p)));
  $("#data").addEventListener("change", desenharCardapio);
  $("#refeicao").addEventListener("change", desenharCardapio);
  desenharCardapio();
</script>
</body>
</html>
